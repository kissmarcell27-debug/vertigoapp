  <script>
/*
 * Döntési logika – „Syncope eljárásrend” (ÉPC-HK SBC SOP 5., v1.0, 2026.02.10.)
 * A lépések a 4. ábra sorrendjét követik: TLOC → kezdeti vizsgálatok (anamnézis, fizikális, aktív állás, EKG)
 * → egyértelmű diagnózis? → rizikóbecslés (magas → közepes → alacsony) → diszpozíció.
 * Tiszta függvények; böngészőben window.SyncopeLogic, Node-ban module.exports.
 */
(function (root) {
  'use strict';

  var num = function (v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  };

  /* ------------------------------------------------------------------ */
  /* Aktív állás vizsgálat – SOP 4.3–4.4                                 */
  /* OH: >20 Hgmm szisztolés vagy >10 Hgmm diasztolés esés, vagy <90 Hgmm */
  /* szisztolés érték. POTS: >30/perc emelkedés vagy >120/perc OH nélkül.*/
  /* ------------------------------------------------------------------ */
  function activeStanding(s) {
    var sup = { sys: num(s['as.supSys']), dia: num(s['as.supDia']), hr: num(s['as.supHr']) };
    var pts = [
      { t: '0 perc', sys: num(s['as.0Sys']), dia: num(s['as.0Dia']), hr: num(s['as.0Hr']) },
      { t: '3 perc', sys: num(s['as.3Sys']), dia: num(s['as.3Dia']), hr: num(s['as.3Hr']) },
      { t: '10 perc', sys: null, dia: null, hr: num(s['as.10Hr']) },
    ];
    var anyStanding = pts.some(function (p) { return p.sys !== null; });
    if (sup.sys === null || !anyStanding) {
      if (s['as.manual'] === 'pos') return { done: true, oh: true, manual: true };
      if (s['as.manual'] === 'neg') return { done: true, oh: false, manual: true };
      if (s['as.manual'] === 'nd') return { done: true, oh: false, manual: true, notDone: true };
      return { done: false };
    }
    var reasons = [];
    pts.forEach(function (p) {
      if (p.sys !== null) {
        var d = sup.sys - p.sys;
        if (d > 20) reasons.push(p.t + ': szisztolés esés ' + d + ' Hgmm (>20)');
        if (p.sys < 90) reasons.push(p.t + ': szisztolés ' + p.sys + ' Hgmm (<90)');
      }
      if (p.dia !== null && sup.dia !== null) {
        var dd = sup.dia - p.dia;
        if (dd > 10) reasons.push(p.t + ': diasztolés esés ' + dd + ' Hgmm (>10)');
      }
    });
    var oh = reasons.length > 0;
    var maxHr = null, hrRise = null;
    pts.forEach(function (p) {
      if (p.hr !== null) {
        if (maxHr === null || p.hr > maxHr) maxHr = p.hr;
        if (sup.hr !== null) { var r = p.hr - sup.hr; if (hrRise === null || r > hrRise) hrRise = r; }
      }
    });
    var pots = !oh && ((hrRise !== null && hrRise > 30) || (maxHr !== null && maxHr > 120));
    return { done: true, oh: oh, reasons: reasons, hrRise: hrRise, maxHr: maxHr, pots: pots };
  }

  // OH okozta syncope bizonyossága (SOP 4.4)
  function ohCertainty(s, as) {
    if (!as.done || !as.oh) return null;
    var rep = s['as.reproduced'], hx = s['as.history'];
    if (!rep || !hx) return null;
    if (rep === 'yes') return hx === 'full' ? 'igazolt' : 'valószínű';
    return hx === 'full' ? 'valószínű' : 'lehetséges';
  }

  /* Carotis sinus masszázs – SOP 4.2 */
  function csm(s) {
    var age = num(s['pt.age']);
    var res = { indicated: age !== null && age > 40, cautions: [] };
    if (s['csm.strokeTia']) res.cautions.push('korábbi stroke / TIA');
    if (s['csm.stenosis']) res.cautions.push('>70%-os carotis stenosis');
    if (s['csm.result'] === 'pos') {
      res.positive = true;
      res.dx = s['csm.reproduced'] === 'yes' && s['hx.prevSyncope'] === 'yes' ? 'CSS' : 'CSH';
    } else if (s['csm.result'] === 'neg') res.positive = false;
    return res;
  }

  /* ------------------------------------------------------------------ */
  /* Kritérium-listák                                                     */
  /* ------------------------------------------------------------------ */
  // EKG – aritmogén syncopét BIZONYÍT (4.5.2); egyben magas kockázat (5.2)
  var EKG_CERTAIN = {
    'e.sinusbrady': 'Perzisztens sinus bradycardia <40/perc, ismétlődő SA-blokk vagy >3 mp-es pauza éber állapotban, terhelés nélkül',
    'e.avb': 'Másodfokú Mobitz II vagy harmadfokú AV-blokk',
    'e.altbbb': 'Alternáló BTSZB és JTSZB',
    'e.vt': 'Kamrai tachycardia (tartós vagy nem tartós)',
    'e.svt': 'Magas kamrai frekvenciájú SVT',
    'e.pvtqt': 'Nem tartós polimorf kamrai tachycardia és rövid vagy hosszú QT',
    'e.pm': 'Pacemaker / ICD diszfunkció pauzákkal',
  };
  // EKG – magas kockázat (5.2), de nem bizonyító
  var EKG_HIGH = {
    'e.ischemia': 'Akut ischaemia jelei',
    'e.slowaf': 'Lassú frekvenciájú pitvarfibrilláció (<40/perc)',
    'e.conduction': 'Tawara-szár-blokk, intraventricularis vezetési zavar, kamrai hypertrophia, ISZB-nek megfelelő Q-hullám, cardiomyopathiára típusos EKG',
    'e.brugada': 'I-es típusú Brugada-jel',
    'e.longqt': 'Hosszú QT szindróma (QTc >460 ms)',
  };
  // EKG – csak korábbi aritmogén syncope esetén magas kockázat (5.2)
  var EKG_COND = {
    'c.mobitz1': 'Mobitz I másodfokú AV-blokk és markánsan megnyúlt PR-szakaszú elsőfokú AV-blokk',
    'c.brady': 'Aszimptomatikus, enyhe inappropriate sinus bradycardia (40–50/perc) vagy lassú PF (40–50/perc)',
    'c.psvt': 'Paroxizmális SVT vagy PF',
    'c.preexc': 'Preexcitált QRS-komplexusok',
    'c.brugada': 'Atípusos Brugada-mintázat',
    'c.arvc': 'Negatív T-hullám jobb precordialis elvezetésekben, ARVC-re utaló epsilon-hullám',
  };
  // Klinikai magas kockázati jegyek (5.2)
  var HIGH = {
    'h.newsymptom': 'Újkeletű mellkasi diszkomfort, légszomj, hasi fájdalom vagy fejfájás',
    'h.exertion': 'Fizikai terhelés alatt vagy fekvő helyzetben jelentkező syncope',
    'h.palp': 'Hirtelen kezdődő palpitáció, melyet közvetlenül syncope követ',
    'h.structural': 'Anamnesztikus súlyos strukturális szív- vagy koronáriabetegség (szívelégtelenség, alacsony EF, korábbi AMI)',
    'h.hypotension': 'A sürgősségi osztályon mással nem magyarázható hypotonia (szisztolés <90 Hgmm)',
    'h.brady': 'Perzisztáló bradycardia (<40/perc) éber állapotban, fizikai megterhelés nélkül',
    'h.murmur': 'Kivizsgálatlan systolés zörej',
    'h.gib': 'Rektális vizsgálat során felmerülő GIV',
  };
  var HIGH_HD = {
    'hd.noprodrome': 'megelőző tünet nélküli vagy <10 mp-es prodromával',
    'hd.family': 'fiatalkori hirtelen szívhalál a családi anamnézisben',
    'hd.sitting': 'ülő helyzetben jelentkező syncope',
  };
  // Alacsony kockázati jegyek (5.1) – a negatív fizikális vizsgálatot és a normál EKG-t külön kérdezzük
  var LOW = {
    'l.prodrome': 'Prodromával induló reflex syncope',
    'l.trigger': 'Kellemetlen látványt, hangot, szagot vagy fájdalmat követően jelentkezett',
    'l.standing': 'Tartós állást követően, vagy zsúfolt / meleg helyen',
    'l.meal': 'Étkezés közben vagy postprandiálisan',
    'l.neck': 'Fej elfordítására vagy a carotis sinusra gyakorolt nyomásra (szűk ruházat, borotválkozás, tumor)',
    'l.history': 'Strukturális szívbetegség hiánya; évekkel korábbi, a jelenlegivel megegyező jegyű alacsony kockázatú syncope',
  };
  // Közepes kockázati jegyek (5.3)
  var MID = {
    'm.recurrent': 'Alacsony kockázatot mutató, de ismétlődő, az életminőséget rontó syncopék',
    'm.shortprodrome': 'Rövid (≈5–10 mp) vagy hiányzó prodromájú reflex syncope, trauma veszélyével',
    'm.activity': 'Magas kockázatú tevékenység (vezetés, repülés, gépi munkavégzés) közben jelentkező syncope',
  };
  var OBSERVE = {
    'o.structural': 'stabil, ismert strukturális szívbetegség',
    'o.chronic': 'súlyos krónikus betegség',
    'o.position': 'syncope fekve vagy ülve, terhelés során',
    'o.palp': 'palpitáció a syncope alatt',
    'o.brady': 'inadekvát sinus bradycardia vagy SA-blokk',
    'o.device': 'beültethető eszköz diszfunkciójának gyanúja',
    'o.preexc': 'preexcitált QRS',
    'o.svt': 'SVT vagy paroxizmális PF',
    'o.inherited': 'öröklött aritmia szindrómára / ARVC-re típusos EKG',
  };
  var ADMIT = {
    'a.comorb': 'osztályos ellátást igénylő társbetegség',
    'a.injury': 'a syncope során keletkezett sérülés',
    'a.workup': 'sürgős kivizsgálás / kezelés, amely más módon nem szervezhető meg (EKG-monitor, echo, terheléses, EPS, angiográfia, eszközdiszfunkció)',
    'a.treatment': 'a kezeléshez osztályos felvétel szükséges',
    'a.recurrent': 'recurráló reflex syncope nagyon rövid vagy hiányzó prodromával (ILR)',
    'a.cardioinhib': 'kardioinhibitoros túlsúlyú reflex syncope (pacing / cardioneuroabláció)',
    'a.oh': 'OH, amelynél megfelelő volumenpótlás után is pozitív az aktív állás vizsgálat',
  };

  function picked(s, map) { return Object.keys(map).filter(function (k) { return s[k]; }).map(function (k) { return map[k]; }); }
  var ekgAbnormal = function (s) { return s['ekg.normal'] === 'no'; };

  /* ------------------------------------------------------------------ */
  /* Egyértelmű / erősen valószínű diagnózis – SOP 4.5                   */
  /* ------------------------------------------------------------------ */
  var DX = {
    vvs: { code: 'VVS', text: 'Vasovagalis syncope (erősen valószínű)', ref: 'SOP 4.5.1' },
    situational: { code: 'SIT', text: 'Szituációs syncope', ref: 'SOP 4.5.1' },
    orthostatic: { code: 'OH', text: 'Ortosztatikus syncope', ref: 'SOP 4.5.1' },
  };

  function certainDx(s, as) {
    var out = [];
    var ekg = ekgAbnormal(s) ? picked(s, EKG_CERTAIN) : [];
    if (ekg.length) out.push({ code: 'ARR', text: 'Aritmogén syncope (' + ekg.join('; ') + ')', ref: 'SOP 4.5.2', auto: true });
    var c = s['dx.certain'];
    if (c === 'vvs' || c === 'situational') out.push(DX[c]);
    if (c === 'orthostatic' && as.done && as.oh) out.push(DX.orthostatic);
    if (c === 'cardiac') {
      if (s['dx.cardiacType'] === 'ischemia') out.push({ code: 'ISCH', text: 'Ischaemiás szívbetegséggel összefüggő syncope (igazolt akut myocardialis ischaemia)', ref: 'SOP 4.5.2' });
      if (s['dx.cardiacType'] === 'structural') out.push({ code: 'STRUCT', text: 'Strukturális szívbetegség okozta syncope' + (s['dx.structural'] ? ' (' + s['dx.structural'] + ')' : ''), ref: 'SOP 4.5.2' });
    }
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* Rizikóbecslés – SOP 5.: magas → közepes → alacsony                   */
  /* ------------------------------------------------------------------ */
  function riskLevel(s, cert) {
    cert = cert || [];
    var auto = [];   // a korábbi lépésekből automatikusan következő magas kockázat
    if (ekgAbnormal(s)) {
      auto = auto.concat(picked(s, EKG_CERTAIN), picked(s, EKG_HIGH));
      if (s['hx.arrSync']) auto = auto.concat(picked(s, EKG_COND).map(function (x) { return x + ' (korábbi aritmogén syncope mellett)'; }));
    }
    cert.forEach(function (d) { if (d.code === 'ISCH' || d.code === 'STRUCT') auto.push(d.text); });

    var clinical = picked(s, HIGH);
    if (s['hd.present']) {
      var hd = picked(s, HIGH_HD);
      if (hd.length) clinical.push('Szívbetegséghez / kóros EKG-hoz társuló syncope: ' + hd.join(', '));
    }
    if (s['h.any'] === 'yes' && !clinical.length) clinical.push('Magas kockázati jegy (nincs részletezve)');

    var high = auto.concat(clinical);
    var mid = picked(s, MID);
    var low = picked(s, LOW);
    var res = { level: null, high: high, auto: auto, mid: mid, low: low, lowMissing: [], needs: null };
    if (high.length) { res.level = 'high'; return res; }
    if (s['h.any'] !== 'no') { res.needs = 'high'; return res; }
    if (s['m.any'] === 'yes' && !mid.length) mid.push('Közepes kockázati jegy (nincs részletezve)');
    if (mid.length) { res.level = 'intermediate'; return res; }
    if (s['m.any'] !== 'no') { res.needs = 'mid'; return res; }
    if (!low.length) res.lowMissing.push('legalább egy alacsony kockázati jegy (5.1)');
    if (s['ex.physical'] !== 'yes') res.lowMissing.push('negatív fizikális vizsgálat');
    if (s['ekg.normal'] !== 'yes') res.lowMissing.push('eltérés nélküli EKG');
    res.level = res.lowMissing.length ? 'intermediate' : 'low';
    return res;
  }

  /* ------------------------------------------------------------------ */
  /* Fő kiértékelés – 4. ábra                                             */
  /* ------------------------------------------------------------------ */
  function evaluate(s) {
    s = s || {};
    var r = { category: null, stage: 'start', path: [], alerts: [], workingDx: [], actions: [], disposition: [], differentials: [] };
    var add = function (list, text, ref) { r[list].push({ text: text, ref: ref }); };
    var alert = function (level, text, ref) { r.alerts.push({ level: level, text: text, ref: ref }); };
    r.as = activeStanding(s);
    r.ohCertainty = ohCertainty(s, r.as);

    // 1. Stabilitás és TLOC
    if (!s.unstable) return r;
    if (s.unstable === 'yes') {
      r.category = 'UNSTABLE';
      r.path.push('Cardiorespiratorikusan instabil');
      alert('danger', 'Kardiorespiratorikusan instabil beteg: ellátás ABCDE szerint – az SOP ezt nem részletezi.', 'SOP 4.1.4');
      r.stage = 'done';
      return r;
    }
    r.path.push('Cardiorespiratorikusan stabil');
    if (s.presyncope) alert('info', 'Presyncope: a prognózis hasonló a syncopéhoz – ugyanolyan alapossággal kell vizsgálni és rizikóstratifikálni.', 'SOP 4.1.3');

    var other = {
      trauma: ['Fejtrauma okozta átmeneti eszméletvesztés', 'Fejsérülés eljárásrend (SOP 17.) szerinti ellátás – a trauma okozta eszméletvesztés nem ennek az eljárásrendnek a tárgya.', 'SOP 1.'],
      not_tloc: ['Nem átmeneti eszméletvesztés', 'A tartós tudatzavar okának kivizsgálása – nem a syncope eljárásrend tárgya.', '4. ábra'],
      tloc_other: ['Átmeneti eszméletvesztés, nem syncope', 'A valószínű ok (epilepsziás roham, pszichogén pseudosyncope / PNES, ritka ok: subclavian steal, vertebrobasilaris TIA, SAV) szerinti kivizsgálás.', 'SOP 2., 1. ábra'],
    }[s.tloc];
    if (other) {
      r.category = 'OTHER';
      r.path.push(other[0]);
      add('actions', other[1], other[2]);
      if (s.tloc === 'trauma') alert('warn', 'A fejsérülésről külön eljárásrend szól – nyissa meg a Fejsérülés modult.', 'SOP 1.');

    }

      r.category = 'OTHER';
      r.path.push('Syncope, de nem ez a vezető panasz');
      add('actions', 'A vezető panasz kivizsgálása és az alapbetegség kezelése (pl. nehézlégzéssel, mellkasi fájdalommal és syncopéval jelentkező pulmonális embólia).', 'SOP 4.1.5');
      r.stage = 'done';
      return r;
    }
    r.path.push('Syncope mint vezető panasz');

    // 2. Kezdeti vizsgálatok (anamnézis, fizikális, aktív állás, EKG)
    add('actions', 'Kezdeti vizsgálatok: alapos auto- és heteroanamnézis, fizikális vizsgálat, fekvő és álló vérnyomás folyamatos EKG-monitor mellett (aktív állás), 12 elvezetéses EKG.', 'SOP 4.1.1, 4. ábra');
    if (r.as.done && r.as.oh) alert('warn', 'Az aktív állás vizsgálat ortosztatikus hypotoniát mutat' + (r.as.reasons ? ': ' + r.as.reasons.join('; ') : '') + (r.ohCertainty ? ' – OH okozta syncope ' + r.ohCertainty + '.' : '.'), 'SOP 4.4');
    if (r.as.done && r.as.pots) alert('info', 'OH nélküli ortosztatikus pulzusemelkedés (>30/perc vagy >120/perc): POTS megfontolandó, ha a panaszokat reprodukálja.', 'SOP 4.4');

    if (r.csm.positive) alert('warn', r.csm.dx === 'CSS' ? 'Pozitív CSM, reprodukált tünetekkel és korábbi syncopéval: carotis sinus szindróma (CSS).' : 'Pozitív CSM: carotis sinus hyperaesthesia (CSH) – tisztázatlan syncopéban nem specifikus lelet.', 'SOP 4.2');

    if (s['x.structural']) add('actions', 'Echokardiográfia (ismert vagy felmerülő strukturális szívbetegség, kardiovaszkuláris etiológia).', 'SOP 4.1.2');

    if (r.csm.dx === 'CSS') r.workingDx.push({ text: 'Carotis sinus szindróma', ref: 'SOP 4.2' });
    if (cert.length) {
      r.path.push('Egyértelmű / erősen valószínű diagnózis: ' + cert.map(function (d) { return d.text; }).join('; '));
      add('actions', 'Egyértelmű / erősen valószínű diagnózis: további vizsgálat nem szükséges, a kezelés megkezdhető.', 'SOP 4.5, 4. ábra');
    } else {
      r.path.push('Bizonytalan diagnózis → rizikóbecslés');
      if (s['sug.reflex']) r.workingDx.push({ text: 'Reflex syncope felvethető', ref: 'SOP 4.6.1' });
      if (s['sug.orth']) r.workingDx.push({ text: 'Ortosztatikus syncope felvethető', ref: 'SOP 4.6.2' });
      if (s['sug.cardiac']) r.workingDx.push({ text: 'Kardiogén syncope felvethető', ref: 'SOP 4.6.3' });
    }
    var benign = cert.length && cert.every(function (d) { return ['VVS', 'SIT', 'OH'].indexOf(d.code) >= 0; });
    if (benign) alert('info', 'Reflex / ortosztatikus syncope csak akkor valószínűsíthető, ha kardiogén syncopéra utaló tényező nincs – a rizikóbecslésben nézze át a magas kockázati jegyeket.', 'SOP 4.5.1');

    // 4. Rizikóbecslés
    var risk = riskLevel(s, cert);
    r.risk = risk;
    if (!risk.level) { r.stage = 'risk'; return r; }
    var label = { low: 'Alacsony', intermediate: 'Közepes', high: 'Magas' }[risk.level];
    r.category = { low: 'LOW', intermediate: 'INTERMEDIATE', high: 'HIGH' }[risk.level];
    r.path.push(label + ' kockázat');

    // 5. Diszpozíció – SOP 6.
    if (risk.level === 'low') {
      if (!r.workingDx.length) r.workingDx.push({ text: 'Valószínűleg reflex, szituációs vagy ortosztatikus syncope', ref: 'SOP 6.1' });
      add('disposition', 'Alacsony kockázat: további sürgősségi kivizsgálás nem szükséges, a sürgősségi osztályról emittálható (egyéb kórképek, sérülések, szociális okok miatt felvétel lehet indokolt).', 'SOP 6.1, 4. ábra');
      add('actions', 'Betegtájékoztatás, megnyugtatás, betegoktatás, életmód-változtatás (provokáló tényezők kerülése, adekvát folyadék- és sóbevitel hypertonia hiányában), ellenmanőverek betanítása.', 'SOP 6.1, 7.');
      if (s['rf.present']) add('actions', 'Rizikófaktorok miatt járóbeteg-ellátásba (kardiológiai szakrendelés) irányítás.', 'SOP 6.1');
    } else if (risk.level === 'intermediate') {
      if (risk.lowMissing.length) alert('info', 'Közepes kockázat, mert az alacsony kockázathoz hiányzik: ' + risk.lowMissing.join(', ') + '.', 'SOP 5.1, 5.3');
      add('disposition', 'Közepes kockázat: hazabocsátás a primer vizsgálatok után nem javasolt; SBO-n monitorozás 12 órán át. Magas kockázatú, felvételt igénylő ok igazolódása esetén osztályos felvétel, ennek hiányában korai szakirányú járóbeteg-kivizsgálás.', 'SOP 6.2, 4. ábra');
      if (s['obs.result'] === 'high') add('disposition', 'Az obszerváció alatt magas kockázatú ok igazolódott: osztályos felvétel a diagnózis és kezelés céljából.', 'SOP 6.2');
      else if (s['obs.result'] === 'clear') add('disposition', 'Az obszerváció alatt magas kockázatra utaló eltérés nem igazolódott: korai szakirányú járóbeteg-kivizsgálásra irányítás.', 'SOP 6.2');
    } else {
      alert('danger', 'Magas kockázat: ' + risk.high.join('; ') + '.', 'SOP 5.2');
      add('disposition', 'Magas kockázat: monitorozás resuscitatiós készenlét mellett (jellemzően 6 óráig az SBO-n, legfeljebb 24 óráig kórházban), korai, gyors és intenzív kivizsgálás, sürgős kezelés, szükség esetén osztályos felvétel.', 'SOP 6.3, 4. ábra');
      var adm = picked(s, ADMIT), obs = picked(s, OBSERVE);
      if (adm.length) add('disposition', 'Osztályos felvétel javasolt: ' + adm.join('; ') + '.', 'SOP 6.4.2');
      else if (obs.length) add('disposition', 'SBO fektetős obszerváció, monitorozás javasolt: ' + obs.join('; ') + '.', 'SOP 6.4.1');
    }
    alert('info', 'Kockázatbecslő pontrendszerek (CSRS, EGSYS, San Francisco, OESIL, ROSE) önmagukban nem javasoltak a rizikóbecslésre.', 'SOP 5.4');
    r.stage = 'done';
    return r;
  }

  var api = {
    evaluate: evaluate, activeStanding: activeStanding, ohCertainty: ohCertainty, csm: csm, riskLevel: riskLevel, certainDx: certainDx,

  };

  else root.SyncopeLogic = api;
})(typeof window !== 'undefined' ? window : this);

        '<p><b>Vasovagalis (erősen valószínű):</b> fájdalom, félelem vagy állás váltotta ki, típusos progresszív prodroma (sápadtság, verejtékezés, hányinger). <b>Szituációs (igazolható):</b> mikció, nyelés, székelés, köhögés, tüsszentés, terhelés, nevetés, fúvós hangszer. <b>Ortosztatikus (igazolható):</b> állás közben, egyidejűleg kimutatható jelentős OH. Ezek hiányában reflex/ortosztatikus syncope valószínűsíthető, ha a jegyek jelen vannak és kardiogén tényező nincs.</p>' +
        '<p><b>Aritmogén (bizonyítható):</b> perzisztens sinus bradycardia <40/perc vagy >3 mp pauza ébren, terhelés nélkül; Mobitz II / III. fokú AV-blokk; alternáló BTSZB és JTSZB; VT vagy gyors SVT; nem tartós polimorf VT és rövid/hosszú QT; PM/ICD diszfunkció pauzákkal. <b>Ischaemiás:</b> igazolt akut myocardialis ischaemia mellett. <b>Strukturális:</b> súlyos AS, pitvari myxoma, bal pitvari gömbthrombus, PE, akut aortadisszekció.</p>' +
        '<p><b>Reflex syncopéra utal:</b> korábbi syncope (gyakran 40 év előtt); kellemetlen látvány/hang/szag/fájdalom; tartós állás; étkezés; zsúfolt/meleg hely; autonóm prodroma; fejfordítás / carotis-nyomás; szívbetegség hiánya. <b>Ortosztatikusra:</b> állás alatt/után; tartós állás; terhelést követő állás; postprandiális hypotonia; autonóm neuropathia / parkinsonismus; időben egybeeső gyógyszermódosítás. <b>Kardiogénre:</b> terhelés alatt vagy fekve; hirtelen palpitáció, majd syncope; fiatalkori hirtelen szívhalál a családban; strukturális / koszorúér-betegség; aritmogén EKG-eltérések (tri-/bifascicularis blokk, QRS >0,12 s, Mobitz I + megnyúlt PR, inappropriate bradycardia 40–50/perc, NSVT, rövid/hosszú QT, korai repolarizáció, Brugada I, negatív T jobb precordialisan / epsilon, preexcitáció, HCM-re típusos LVH).</p>',
    },
    {
      id: 'risk', title: 'Rizikóbecslés és diszpozíció (5–6.)',
      html:
        '<p><b>Alacsony:</b> prodromával induló reflex syncope; kellemetlen inger; tartós állás / zsúfolt, meleg hely; étkezés / postprandiális; fejfordítás / carotis-nyomás; strukturális szívbetegség hiánya, évekkel korábbi hasonló syncope; negatív fizikális vizsgálat; EKG eltérés nélkül. → További sürgősségi kivizsgálás nem kell, emittálható; tájékoztatás, életmód; rizikófaktoroknál kardiológiai szakrendelés.</p>' +
        '<p><b>Magas:</b> újkeletű mellkasi diszkomfort, légszomj, hasi fájdalom, fejfájás; terhelés alatt / fekve; hirtelen palpitáció, majd syncope; szívbetegséghez / kóros EKG-hoz társulva prodroma nélkül vagy <10 mp prodromával, fiatalkori hirtelen szívhalál a családban, ülve jelentkező syncope; súlyos strukturális / koronáriabetegség; mással nem magyarázható hypotonia (<90); perzisztáló bradycardia <40; kivizsgálatlan systolés zörej; GIV; EKG: akut ischaemia, Mobitz II/III, lassú PF <40, sinus bradycardia <40 / SA-blokk / >3 mp pauza, Tawara-szár-blokk, IV vezetési zavar, kamrai hypertrophia, Q-hullám, cardiomyopathia, VT, PM/ICD diszfunkció, Brugada I, QTc >460 ms; korábbi aritmogén syncope mellett további EKG-eltérések. → Monitorozás resuscitatiós készenlétben (jellemzően 6 óra SBO, max. 24 óra kórház), gyors kivizsgálás, szükség esetén felvétel.</p>' +
        '<p><b>Közepes:</b> sem alacsony, sem magas; ismétlődő, életminőséget rontó alacsony kockázatú syncopék; rövid/hiányzó prodromájú reflex syncope trauma veszélyével; magas kockázatú tevékenység közben. → Nem bocsátható haza a primer vizsgálatok után; 12 órás SBO-monitorozás; magas kockázatú ok esetén felvétel, egyébként korai szakirányú járóbeteg-kivizsgálás.</p>' +
        '<p><b>Pontrendszerek</b> (CSRS, EGSYS, San Francisco, OESIL, ROSE) önmagukban nem javasoltak.</p>' +
        '<p><b>Fektetős obszerváció (magas kockázat):</b> stabil, ismert strukturális szívbetegség; súlyos krónikus betegség; syncope fekve/ülve, terhelés során; palpitáció a syncope alatt; inadekvát sinus bradycardia / SA-blokk; eszközdiszfunkció gyanúja; preexcitáció; SVT / paroxizmális PF; öröklött aritmia szindróma / ARVC EKG. <b>Osztályos felvétel:</b> osztályos ellátást igénylő társbetegség; a syncope során keletkezett sérülés; más módon nem szervezhető sürgős kivizsgálás / kezelés; recurráló reflex syncope nagyon rövid / hiányzó prodromával (ILR); kardioinhibitoros reflex syncope; volumenpótlás után is pozitív aktív állás.</p>' +
        '<p><b>Obszerváció után:</b> a monitorozás időtartama a súlyosság és a várható recidíva szerint; ha ICD/PM-indikáció egyértelmű, monitorozás nem kell; aritmia hiányában a presyncope nem egyenértékű a syncopéval, de ha alatta szignifikáns aritmia rögzül, diagnosztikus; syncope alatt detektált aritmia hiánya kizárja az aritmogén syncopét.</p>' +
        '<p><b>Kezelés:</b> súlyos/gyakori reflex syncope alacsony vérnyomás fenotípussal vagy hipotonizáló gyógyszerrel → szakirányú kivizsgálás. Esésre hajlamosaknál ACE-gátló, ARB, Ca-csatorna-blokkoló előnyben a diuretikummal és béta-blokkolóval szemben. Hypertonia hiányában 2–3 l folyadék és 10 g só naponta.</p>',
    },
    {
      id: 'leaflet', title: 'Betegtájékoztató – reflex syncope (7.)',
      html:
        '<p>A syncope (ájulás) rövid, általában 1–2 perces eszméletvesztés, oka az agy átmeneti vérellátás-csökkenése. Leggyakoribb formája a vazovagális syncope; az emberek negyede élete során legalább egyszer átéli.</p>' +
        '<p><b>Ha ájulásérzése van:</b> a legjobb lefeküdni és a lábait megemelni; ha erre nincs lehetőség, üljön le, vagy alkalmazzon ellenmanővert. Gyakori ájulásnál bőséges folyadékfogyasztás (kb. 2 liter) és sóban gazdagabb étrend javasolt (kivéve, ha orvosi okból sómegszorítás szükséges).</p>' +

    {
      id: 'sources', title: 'Források',
      html: '<ul><li>ÉPC-HK SBC: Syncope eljárásrend, SOP 5., v1.0 (2026.02.10.) – az app döntési fája ezen alapul.</li>' +
        '<li>Az SOP irodalma: ESC 2018 Syncope Guideline; Wieling W et al. J Intern Med 2013;273:345–358 (carotis sinus hyperaesthesia).</li>' +
        '<li>Az OH-kritériumok itt az SOP szerint szigorú egyenlőtlenséggel (>20 / >10 Hgmm) és a <90 Hgmm abszolút értékkel értékelődnek – ez eltér a szédülés-modulban használt (≥20 / ≥10) konszenzus-definíciótól.</li></ul>',
    },
  ];

  var api = { SOP: SOP, REFERENCE: REFERENCE, COUNTER: COUNTER };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SyncopeContent = api;

        return '<div class="note info"><b>Kezelési megfontolások (6.6):</b> súlyos / gyakori reflex syncope alacsony vérnyomás fenotípussal vagy hipotonizáló gyógyszerrel → szakirányú járóbeteg-kivizsgálás. Esésre hajlamosaknál ACE-gátló, ARB, Ca-csatorna-blokkoló előnyben a diuretikummal és béta-blokkolóval szemben. Hypertonia hiányában 2–3 l folyadék és 10 g só naponta.</div>' +
          '<button type="button" class="btn" data-goto-ref="leaflet">Betegtájékoztató (ellenmanőverek) megnyitása / nyomtatása</button>';
      },
    },
  };

  SBO.register({
    id: 'syncope',
    title: 'Syncope',
    short: 'Syncope',
    description: 'TLOC besorolás, aktív állás vizsgálat, CSM, EKG, egyértelmű diagnózis, rizikóbecslés (magas → közepes → alacsony), diszpozíció, betegtájékoztató.',
    sop: C.SOP,
    steps: STEPS,
    stepVisible: stepVisible,
    stageToStep: { start: 'start', history: 'history', exam: 'exam', ekg: 'ekg', dx: 'dx', risk: 'risk', done: 'summary' },
    evaluate: L.evaluate,
    categories: { UNSTABLE: 'Instabil beteg – ABCDE', OTHER: 'Nem a syncope eljárásrend tárgya', LOW: 'Alacsony kockázatú syncope', INTERMEDIATE: 'Közepes kockázatú syncope', HIGH: 'Magas kockázatú syncope' },
    dangerCategories: ['UNSTABLE', 'HIGH'],
    widgets: widgets,
    reportFindings: function (s, r) {
      var lines = [];
      if (r.as && r.as.done) lines.push('AKTÍV ÁLLÁS: ' + (r.as.notDone ? 'nem végezhető' : r.as.oh ? 'OH' + (r.as.reasons ? ' (' + r.as.reasons.join('; ') + ')' : '') : r.as.pots ? 'OH nélküli pulzusemelkedés' : 'negatív') + (r.ohCertainty ? ' – OH-syncope ' + r.ohCertainty : ''));
      if (s['csm.result'] === 'pos' || s['csm.result'] === 'neg') lines.push('CSM: ' + (s['csm.result'] === 'pos' ? 'pozitív (' + r.csm.dx + ')' : 'negatív'));
      if (s['ekg.normal']) lines.push('EKG: ' + (s['ekg.normal'] === 'yes' ? 'eltérés nélkül' : 'kóros') + (s['ekg.text'] ? ' – ' + s['ekg.text'] : ''));
      if (r.risk && r.risk.level) {
        lines.push('RIZIKÓ: ' + { low: 'alacsony', intermediate: 'közepes', high: 'magas' }[r.risk.level]);
        r.risk.high.concat(r.risk.mid).forEach(function (x) { lines.push('- ' + x); });
        if (r.risk.lowMissing.length) lines.push('- alacsony kockázathoz hiányzik: ' + r.risk.lowMissing.join(', '));
      }
      return lines;
    },
    docSections: function (s, r) { return D.sections(s, r); },
    reference: function () { return C.REFERENCE; },
  });
})();

  <script>
/*
 * Döntési logika – „Intracranialis vérzések sürgősségi kezelése” SOP (ÉPC-HK SBC, 17., v1.0, 2024.04.25.)
 * Tiszta függvények; böngészőben window.HeadInjuryLogic, Node-ban module.exports.
 * Minden következtetés mellett `ref`: az SOP fejezete / melléklete.
 */
(function (root) {
  'use strict';

  var yes = function (v) { return v === 'yes' || v === true; };
  var num = function (v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  };

  /* ------------------------------------------------------------------ */
  /* GCS                                                                 */
  /* ------------------------------------------------------------------ */
  function gcs(s) {
    var e = num(s['gcs.e']), v = num(s['gcs.v']), m = num(s['gcs.m']);
    if (e === null || v === null || m === null) return { complete: false, total: null };
    return { complete: true, e: e, v: v, m: m, total: e + v + m };
  }

  /* ------------------------------------------------------------------ */
  /* Rizikócsoport – SOP 4.                                              */
  /* ------------------------------------------------------------------ */
  var HIGH = {
    'hr.neuro': 'Neurológiai kórjelek (aluszékony / soporosus betegnél anisocoria, durva végtaggyengeség, epilepsziás rosszullét)',
    'hr.progressive': 'A tudatzavar progresszív',
    'hr.penetrating': 'Penetráló vagy impressziós koponyasérülés és/vagy súlyos maxillofacialis sérülés',
    'hr.mechanism': 'A baleseti mechanizmus vagy a külsérelem alapján intracranialis sérülés valószínű',
    'hr.atls': 'ATLS-kritérium (eszméletlen; >2 m / testmagasság feletti esés; járműből kirepült; nagy sebességű ütközés: gyalogos >5 km/h, motoros >30 km/h, személygépkocsi >60 km/h; karosszéria-deformitás; elhunyt a járműben; légzsák nyílt)',
  };
  var MODERATE = {
    'mr.loc': 'Bizonyítható eszméletvesztés a sérüléskor vagy azt követően',
    'mr.headache': 'Progresszív (egyértelműen erősödő) vagy elviselhetetlen fejfájás és/vagy zavartság, nyugtalanság',
    'mr.intox': 'Alkohol- vagy drogintoxikáció (feltételezhető vagy bizonyítható)',
    'mr.seizure': 'Epilepsziás görcs vagy arra utaló adat',
    'mr.unreliable': 'Megbízhatatlan anamnézis, anamnézis nem nyerhető',
    'mr.pta': 'Poszttraumás amnézia',
    'mr.basal': 'Koponyaalapi törés fizikális jelei',
    'mr.repeated': 'Többszörösen ismételt trauma',
    'mr.depressed': 'Impressziós koponyatörés gyanúja',
    'mr.nai': 'Bántalmazás (bántalmazott gyermek / családon belüli erőszak) gyanúja',
    'mr.subgaleal': 'Nagy kiterjedésű subgalealis vérzés és duzzanat',
    'mr.coag': 'Antikoagulált, thrombocytaaggregáció-gátlót szedő, dekompenzált májbeteg vagy más coagulopathiás sérült',
    'mr.focal': 'Ismeretlen eredetű / korú fokális neurológiai tünet',
    'mr.multi': 'Változó korú, többszörös sérülésre utaló külsérelmek',
    'mr.xray': 'Koponyatörés RTG-jelei',
  };

  function vomitCount(s) { var n = num(s['vomit.n']); return n === null ? 0 : n; }

  function riskGroup(s) {
    var g = gcs(s);
    var high = Object.keys(HIGH).filter(function (k) { return s[k]; }).map(function (k) { return HIGH[k]; });
    if (g.complete && g.total <= 12) high.unshift('GCS ' + g.total + ' (≤12) – tudatzavar');
    var mod = Object.keys(MODERATE).filter(function (k) { return s[k]; }).map(function (k) { return MODERATE[k]; });
    if (vomitCount(s) >= 2) mod.push('Kettő vagy többszöri hányás (' + vomitCount(s) + '×)');
    var age = num(s['pt.age']);
    if (age !== null && (age < 2 || age > 70) && !s['mr.trivial']) mod.push('Életkor ' + age + ' év (<2 vagy >70 év, nem teljesen jelentéktelen sérülés)');
    var level = null;
    if (high.length) level = 'high';
    else if (mod.length) level = 'moderate';
    else if (s['risk.none']) level = 'low';
    return { level: level, high: high, moderate: mod };
  }

  /* ------------------------------------------------------------------ */
  /* CT-indikáció és időzítés – SOP 7. és 13.                            */
  /* ------------------------------------------------------------------ */
  function ctIndication(s, risk) {
    var g = gcs(s);
    var r1 = [];   // 1 órán belül
    if (g.complete && g.total <= 12) r1.push('GCS ≤12 a kezdeti értékeléskor');
    if (s['ct.gcs2h'] === 'yes') r1.push('GCS <15 a sérülés után 2 órával');
    if (s['mr.depressed'] || s['hr.penetrating']) r1.push('Nyílt vagy impressziós koponyatörés gyanúja');
    if (s['mr.basal']) r1.push('Koponyaalapi törés jele (haemotympanum, pápaszem-haematoma, liquorrhoea)');
    if (s['mr.seizure']) r1.push('Poszttraumás roham');
    if (s['mr.focal'] || s['hr.neuro']) r1.push('Fokális neurológiai deficit');
    if (vomitCount(s) > 1) r1.push('Több mint 1 hányásos epizód');

    var r8 = [];   // eszméletvesztés / amnézia + kockázati tényező → 8 órán belül
    var locAmn = s['mr.loc'] || s['mr.pta'];
    if (locAmn) {
      var age = num(s['pt.age']);
      if (age !== null && age >= 65) r8.push('65 éves vagy idősebb');
      if (s['mr.coag']) r8.push('Vérzési vagy véralvadási zavar');
      if (s['ct.dangerous']) r8.push('Veszélyes sérülési mechanizmus (elütött gyalogos/kerékpáros, járműből kiesett, >1 m vagy 5 lépcsőfok)');
      if (s['ct.retro']) r8.push('>30 perces retrográd amnézia');
    }

    var out = { indicated: false, timing: null, reasons: [], cspine: [], highExtra: false };
    if (r1.length) { out.indicated = true; out.timing = '1h'; out.reasons = r1; }
    else if (r8.length) {
      out.indicated = true;
      out.timing = s['ct.over8h'] ? '1h' : '8h';
      out.reasons = ['Eszméletvesztés / amnézia és: ' + r8.join(', ')];
    }
    // Összegző szabály: minden legalább közepes kockázatú fejsérültnél non-contrast CT
    if (risk.level === 'moderate' || risk.level === 'high') {
      out.indicated = true;
      if (!out.timing) out.timing = 'indicated';
      if (!out.reasons.length) out.reasons = ['Legalább közepes kockázatú fejsérült'];
    }
    if (risk.level === 'high') out.highExtra = true; // CI–CII (optimálisan CI–ThI) CT-vel kiegészítve

    // Nyaki gerinc CT (SOP 7.)
    if (g.complete && g.total <= 12) out.cspine.push('GCS ≤12 a kezdeti értékeléskor');
    if (s['cs.intubated']) out.cspine.push('Intubált beteg');
    if (s['cs.urgent']) out.cspine.push('A nyaki gerinc sérülésének sürgős definitív diagnózisa szükséges');
    if (s['cs.polytrauma']) out.cspine.push('Éber, stabil betegnél a fejet és a mellkast/hasat/medencét is érintő tompa polytrauma');
    if (s['cs.suspicion']) {
      var f = [];
      var a = num(s['pt.age']);
      if (a !== null && a >= 65) f.push('≥65 év');
      if (s['cs.mech']) f.push('veszélyes mechanizmus');
      if (s['cs.focal']) f.push('fokális perifériás neurológiai deficit');
      if (s['cs.paresth']) f.push('paresztézia a végtagokban');
      if (s['mr.intox']) f.push('intoxikáció');
      if (f.length) out.cspine.push('Nyaki gerinc sérülésének klinikai gyanúja és: ' + f.join(', '));
    }
    return out;
  }

  /* Speciális betegcsoport (SOP 13.) – csak közepes kockázatnál */
  function special(s, risk, ct) {
    if (risk.level !== 'moderate') return null;
    var g = gcs(s);
    if (s['sp.anticoag'] === 'vka' || s['sp.anticoag'] === 'noac') {
      var inr = num(s['inr']);
      var res = { group: 'anticoag', inr: inr };
      if (ct.timing === '1h') { res.ctTiming = 'now'; res.symptomatic = true; return res; }
      if (inr === null) { res.ctTiming = null; return res; }
      if (inr > 1.4) { res.ctTiming = 'now'; res.obs12 = true; }
      else if (inr < 1.4) { res.ctTiming = '4h'; }
      else { res.ctTiming = 'now'; res.obs12 = true; res.borderline = true; } // INR = 1,4: az SOP nem definiálja → biztonságosabb út
      return res;
    }
    if (s['sp.tag'] === 'yes') {
      var sym = [];
      if (g.complete && g.total < 15) sym.push('GCS <15');
      if (s['mr.headache']) sym.push('progresszív fejfájás');
      if (vomitCount(s) > 2) sym.push('kettőnél többször hányt');
      if (s['sp.amnesia']) sym.push('elhúzódó amnézia');
      return sym.length ? { group: 'tag', ctTiming: 'now', obs12: true, reasons: sym } : { group: 'tag', ctTiming: '4h', reasons: [] };
    }
    return null;
  }

  /* ------------------------------------------------------------------ */
  /* Fő kiértékelés – 1. melléklet (folyamatábra), 2., 11–13. fejezet     */
  /* ------------------------------------------------------------------ */
  var NONTRAUMA = {
    deep: { dx: 'Nem traumás, hypertoniás (törzsdúci) ICH', dispo: 'Szinte kizárólag stroke-centrumba helyezendő.' },
    lobar: { dx: 'Nem traumás lobáris vérzés', dispo: 'További kivizsgálás (CT-angiográfia, esetleg halasztott DSA), majd SBO fektető / idegsebészeti osztály, esetleg területi neurológia; ritkán műtét.' },
    sah: { dx: 'Nem traumás subarachnoidealis vérzés', dispo: 'Neuroendovascularis ellátás: előzetes referálást követően hétköznap 24 órában intézményünkben; ha ez nem lehetséges, vagy hétvégén, az idegsebész az OMIII-ba referálja.' },
  };

  function admissionReasons(s) {
    var map = {
      'adm.imaging': 'Új, klinikailag fontos eltérés a képalkotás során',
      'adm.gcs': 'A GCS nem tért vissza 15-re / a sérülés előtti alapvonalra',
      'adm.symptoms': 'Folyamatos aggasztó tünetek (tartós hányás, súlyos fejfájás, görcsroham)',
      'adm.other': 'Egyéb aggodalomra okot adó klinikum (intoxikáció, egyéb sérülés, sokk, nem véletlen sérülés gyanúja, meningitis, liquorcsorgás, fennálló poszttraumás amnézia)',
    };
    return Object.keys(map).filter(function (k) { return s[k]; }).map(function (k) { return map[k]; });
  }

  function evaluate(s) {
    s = s || {};
    var r = { category: null, stage: 'start', path: [], alerts: [], workingDx: [], actions: [], disposition: [], differentials: [] };
    var add = function (list, text, ref) { r[list].push({ text: text, ref: ref }); };
    var alert = function (level, text, ref) { r.alerts.push({ level: level, text: text, ref: ref }); };
    r.gcs = gcs(s);

    if (s.critical === 'yes') {
      alert('danger', 'Kritikus állapotú beteg: vizsgálat és ellátás ABCDE szerint, monitorozás (légzés, SpO₂, pulzus/EKG, RR); célzott oxigénterápia (SpO₂ 90–94%).', 'SOP 5.');
    }
    if (r.gcs.complete && r.gcs.total < 8) {
      alert('danger', 'GCS ' + r.gcs.total + ' (<8): emelt szintű légútbiztosítás javasolt (RSI, váltásvezetővel egyeztetve).', 'SOP 5. AB');
    }
    if (s['sp.anticoag'] === 'vka') alert('warn', 'K-vitamin-antagonistát szedő betegnél az INR levétele minden esetben kötelező.', 'SOP 6.');

    if (!s.etiology) { r.stage = 'start'; return r; }

    /* ---------------- Nem traumás ICH ---------------- */
    if (s.etiology === 'nontrauma') {
      r.category = 'NONTRAUMA';
      r.path.push('Nem traumás intracranialis vérzés');
      add('actions', 'Non-contrast koponya CT (gold standard).', 'SOP 7.');
      add('actions', 'Labor: ionok, vese- és májfunkció, vérkép, vércsoport és ellenanyagszűrés, alvadási paraméterek (INR, APTI, TI, TCT, fibrinogén; ClotPro).', 'SOP 6.');
      add('actions', 'Antikoaguláns terápia felfüggesztése: lásd ClotPro eljárásrend.', 'SOP 8.');
      if (!s['nt.type']) { r.stage = 'nontrauma'; return r; }
      var nt = NONTRAUMA[s['nt.type']];
      r.path.push(nt.dx);
      r.workingDx.push({ text: nt.dx, ref: 'SOP 2.' });
      if (s['nt.type'] === 'sah') add('actions', 'SAV esetén még a CT-vizsgálóban idegsebészeti / radiológiai konzultáció a CTA elvégzéséről.', 'SOP 7.');
      if (s['nt.large'] === 'yes') {
        alert('danger', 'Nagyméretű, sebészileg hozzáférhető ICH vagy obstruktív hydrocephalus: az idegsebészeti konzultáció életmentő – a CT után mihamarabb értesítse az idegsebészt.', 'SOP 9.');
        add('actions', 'Azonnali idegsebészeti konzultáció.', 'SOP 9.');
      }
      add('disposition', nt.dispo, 'SOP 2.');
      r.stage = 'treatment';
      return r;
    }

    /* ---------------- Traumás fejsérülés ---------------- */
    r.path.push('Traumás fejsérülés');
    var risk = riskGroup(s);
    r.risk = risk;
    if (!risk.level) { r.stage = 'risk'; return r; }
    var label = { low: 'Alacsony', moderate: 'Közepes', high: 'Magas' }[risk.level];
    r.category = { low: 'LOW', moderate: 'MODERATE', high: 'HIGH' }[risk.level];
    r.path.push(label + ' kockázatú fejsérült');

    if (risk.level === 'low') {
      add('disposition', 'Alacsony kockázat: CT nem szükséges; emisszió, ha nincs más felvételt indokoló tényező, és a biztonságos otthonbocsátás feltételei (pl. otthoni felügyelet) adottak.', 'SOP 12., 1. melléklet');
      add('actions', 'Fejsérülteknek szóló tájékoztató átadása, tényének rögzítése az epikrízisben.', 'SOP 12., 2. melléklet');
      r.ct = { indicated: false, reasons: [], cspine: [] };
      r.stage = 'dispo';
      return evaluateDischarge(s, r, add, alert);
    }

    var ct = ctIndication(s, risk);
    r.ct = ct;
    var sp = special(s, risk, ct);
    r.special = sp;
    if (risk.level === 'moderate' || risk.level === 'high') {
      add('actions', 'Oxigénterápia (legalább orrszonda) már a CT megkezdése előtt.', 'SOP 5. AB');
    }

    // CT időzítése
    if (sp && sp.group === 'anticoag') {
      if (sp.inr === null && sp.ctTiming === null) {
        alert('warn', 'Antikoagulált, közepes kockázatú betegnél a CT időzítése az INR-től függ – adja meg az INR értékét.', 'SOP 13.1');
        r.stage = 'ct';
        return r;
      }
      if (sp.ctTiming === 'now') add('actions', 'Azonnali non-contrast koponya CT' + (sp.symptomatic ? ' (1 órás CT-kritérium áll fenn).' : ' (INR ' + sp.inr + ' > 1,4).'), 'SOP 13.1, 7.');
      else add('actions', 'Non-contrast koponya CT a trauma után 4 órával (INR ' + sp.inr + ' < 1,4).', 'SOP 13.1');
      if (sp.borderline) alert('warn', 'INR = 1,4: az SOP csak az „1,4 felett” és „1,4 alatt” esetet definiálja – a biztonságosabb utat (azonnali CT, negatív CT esetén 12 órás obszerváció) javasoljuk.', 'SOP 13.1; óvatossági elv');
      if (s['sp.anticoag'] === 'noac') alert('info', 'NOAC-hatást az INR nem tükrözi megbízhatóan (nem az SOP része) – a klinikai megítélés és a ClotPro eljárásrend irányadó.', 'nem SOP');
    } else if (sp && sp.group === 'tag') {
      if (sp.ctTiming === 'now') add('actions', 'Azonnali non-contrast koponya CT (TAG-gátló + ' + sp.reasons.join(', ') + ').', 'SOP 13.2');
      else add('actions', 'Tünetmentes, TAG-gátlót szedő beteg: non-contrast koponya CT a trauma után 4 órával.', 'SOP 13.2');
    } else if (ct.timing === '1h') {
      add('actions', 'Non-contrast koponya CT 1 órán belül: ' + ct.reasons.join('; ') + '.', 'SOP 7.');
    } else if (ct.timing === '8h') {
      add('actions', 'Non-contrast koponya CT a fejsérülést követő 8 órán belül: ' + ct.reasons.join('; ') + '.', 'SOP 7.');
    } else {
      add('actions', 'Non-contrast koponya CT (minden legalább közepes kockázatú fejsérültnél).', 'SOP 7.');
    }
    if (ct.highExtra) add('actions', 'Magas kockázat: a CT kiegészítése legalább a CI–CII, optimálisan a CI–ThI szegmentumokkal.', 'SOP 7.');
    if (ct.cspine.length) add('actions', 'Nyaki gerinc CT is szükséges: ' + ct.cspine.join('; ') + '.', 'SOP 7.');
    add('actions', 'Labor: ionok, vese- és májfunkció, vérkép, vércsoport és ellenanyagszűrés, alvadási paraméterek (INR, APTI, TI, TCT, fibrinogén; ClotPro).', 'SOP 6.');

    if (!s['ct.result']) { r.stage = 'ct'; return r; }

    if (s['ct.result'] === 'pos') {
      r.category = 'POSITIVE';
      r.path.push('CT: intracranialis vérzés / traumás eltérés igazolódott');
      r.workingDx.push({ text: 'Traumás intracranialis sérülés (CT-vel igazolt)', ref: 'SOP 7.' });
      alert('danger', 'Pozitív CT: azonnali idegsebészeti konzílium.', '1. melléklet, SOP 9., 13.');
      add('actions', 'Azonnali idegsebészeti konzílium.', 'SOP 9., 13.');
      if (sp && sp.group === 'anticoag') add('actions', 'Antikoagulált beteg, pozitív CT: PCC adása javasolt; antikoaguláció felfüggesztése a ClotPro eljárásrend szerint.', 'SOP 13.1, 8.');
      if (s['ct.sah']) add('actions', 'SAV: még a CT-vizsgálóban idegsebészeti / radiológiai konzultáció a CTA elvégzéséről.', 'SOP 7.');
      add('actions', 'Obszerváció (ha nem kerül azonnal intenzív osztályra vagy műtőbe): GCS, pupilla, végtagmozgások, légzésszám, pulzus, RR, hőmérséklet, SpO₂ – félóránként a 15-ös GCS eléréséig, majd 6 órán át óránként, utána 2 óránként. Kontroll CT az első vizsgálat után 12 órával, neurológiai romlásnál azonnal.', 'SOP 11.');
      var dec = { op: 'Műtő', ito: 'Intenzív osztály', obs: 'SBO fektető részleg – obszerváció', other: 'Elhelyezés egyeztetés alatt / idegsebészeti javaslat alapján' }[s['ns.decision']];

  function status(s, r) {
    var L = [T.vitalsLine(s)];

  function imaging(s) {
    if (!s['ct.result']) return 'Koponya CT: ' + B;

  function epicrisis(s, r) {
    var t = [];
    if (s.etiology === 'nontrauma') {
      t.push('A fentebb részletezett anamnézisű beteget intracranialis vérzés miatt vizsgáltuk ambulanciánkon.');

      t.push(s['leaflet.given'] ? 'A fejsérülteknek szóló tájékoztatót megkapta.' : 'Fejsérülteknek szóló tájékoztató átadása: ' + B + '.');

  }

    var J = [];

      J.push('Az idegsebészeti konzílium / fogadó osztály javaslata szerint: ' + B + '.');

      if (s['nt.type'] === 'lobar') out.push('I61.1 Agyvérzés a féltekében, corticalis');
      if (s['nt.type'] === 'sah') out.push('I60.9 Subarachnoidealis vérzés, k.m.n.');

      if (s['ct.sah']) out.push('S06.6 Traumás subarachnoidealis vérzés');

    s = s || {};

        { type: 'check', key: 'adm.other', label: 'Egyéb aggodalomra okot adó klinikum (intoxikáció, egyéb sérülés, sokk, nem véletlen sérülés gyanúja, meningitis, liquorcsorgás, fennálló PTA)' },
        { type: 'heading', label: 'Emisszió feltételei (SOP 12.)' },
        { type: 'yn', key: 'dc.gcs', label: 'A GCS visszatért 15-re / a sérülés előtti értékre?', when: function (s, r) { return !(r.ct && r.ct.indicated === false); } },
        { type: 'yn', key: 'dc.noother', label: 'Nincs más felvételt indokoló tényező?' },
        { type: 'yn', key: 'dc.supervision', label: 'Megfelelő otthoni felügyelet biztosított?' },
        { type: 'heading', label: 'Neurológiai romlás jelei – sürgős újraértékelés és CT' },
        { type: 'widget', name: 'deterioration' },
      ],
    },
    {
      id: 'treatment', title: 'Aranyóra – kezelés', ref: 'SOP 5., 10.',
      fields: [
        { type: 'num', key: 'wt', label: 'Testtömeg (kg) – a dózisok kiszámításához' },
        { type: 'num', key: 'bp.sys', label: 'Kezdeti szisztolés vérnyomás (Hgmm) – a célérték kiszámításához' },
        { type: 'widget', name: 'golden' },
        { type: 'text', key: 'sbo.therapy', label: 'Az SBO-n alkalmazott terápia (epikrízisbe)' },
      ],
    },
    {
      id: 'summary', title: 'Összegzés / dokumentáció', ref: '',
      fields: [
        { type: 'heading', label: 'Az ambuláns laphoz' },
        { type: 'text', key: 'inj.time', label: 'A sérülés ideje (pl. „ma 14 órakor”)', when: trauma },
        { type: 'text', key: 'inj.mech', label: 'Mechanizmus (pl. „saját magasságból történt elesés”)', when: trauma },
        { type: 'text', key: 'inj.wound', label: 'Külsérelmi nyom', when: trauma },
        { type: 'yn', key: 'loc.no', label: 'Kifejezetten rákérdezve: eszméletvesztése NEM volt?', when: function (s) { return trauma(s) && !s['mr.loc']; } },
        { type: 'yn', key: 'neuro.nofocal', label: 'Durva neurológiai gócjel nem észlelhető?', when: function (s) { return !s['mr.focal'] && !s['hr.neuro']; } },
        { type: 'text', key: 'lab.text', label: 'Labor röviden' },
        { type: 'check', key: 'leaflet.given', label: 'A fejsérülteknek szóló tájékoztatót átadtam (SOP 12. – az epikrízisben rögzíteni kell)', when: trauma },
        { type: 'summary' },
      ],
    },
  ];

  function stepVisible(id, s, r) {
    switch (id) {
      case 'nontrauma': return s.etiology === 'nontrauma';
      case 'risk': return s.etiology === 'trauma';
      case 'ct': return s.etiology === 'trauma' && r.risk && (r.risk.level === 'moderate' || r.risk.level === 'high');
      case 'ctresult': return s.etiology === 'trauma' && r.risk && (r.risk.level === 'moderate' || r.risk.level === 'high');
      case 'dispo': return s.etiology === 'trauma' && r.risk && !!r.risk.level && s['ct.result'] !== 'pos';
      default: return true;
    }
  }

  function li(arr, esc) { return '<ul>' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; }

  var widgets = {
    gcs: {
      render: function () { return ''; },
      live: function (ctx) {
        var g = ctx.r.gcs;
        if (!g || !g.complete) return '<div class="note info">GCS: adja meg mindhárom komponenst.</div>';
        var lvl = g.total <= 8 ? 'danger' : g.total <= 12 ? 'warn' : g.total < 15 ? 'info' : 'ok';
        return '<div class="note ' + lvl + '"><b>GCS ' + g.total + '</b> (E' + g.e + ' V' + g.v + ' M' + g.m + ')' +
          (g.total < 8 ? ' – emelt szintű légútbiztosítás javasolt (SOP 5.)' : g.total <= 12 ? ' – magas kockázat, CT 1 órán belül (SOP 4., 7.)' : '') + '</div>';
      },
    },
    risk: {
      render: function () { return ''; },
      live: function (ctx) {
        var r = ctx.r.risk;
        if (!r || !r.level) return '<div class="note info">Jelöljön kritériumot, vagy erősítse meg, hogy egyik sem áll fenn.</div>';
        var cls = { low: 'ok', moderate: 'warn', high: 'danger' }[r.level];
        var t = { low: 'Alacsony kockázat', moderate: 'Közepes kockázat', high: 'Magas kockázat' }[r.level];
        return '<div class="note ' + cls + '"><b>' + t + '</b>' + (r.high.length ? '<br>Magas: ' + r.high.map(ctx.esc).join('; ') : '') +
          (r.moderate.length ? '<br>Közepes: ' + r.moderate.map(ctx.esc).join('; ') : '') + '</div>';
      },
    },
    ct: {
      render: function () { return ''; },
      live: function (ctx) {
        var ct = ctx.r.ct, sp = ctx.r.special;
        if (!ct) return '';
        var t = { '1h': 'CT 1 órán belül', '8h': 'CT a sérülést követő 8 órán belül', indicated: 'CT indokolt (legalább közepes kockázat)' }[ct.timing] || 'CT nem indokolt';
        if (sp && sp.group === 'anticoag') t = sp.ctTiming === 'now' ? 'Azonnali CT (antikoagulált)' : sp.ctTiming === '4h' ? 'CT a trauma után 4 órával (antikoagulált, INR <1,4)' : 'Antikoagulált: adja meg az INR-t';
        if (sp && sp.group === 'tag') t = sp.ctTiming === 'now' ? 'Azonnali CT (TAG-gátló, tünetes)' : 'CT a trauma után 4 órával (TAG-gátló, tünetmentes)';
        var spWhy = [];
        if (sp && sp.group === 'tag' && sp.reasons.length) spWhy.push('TAG-gátló + ' + sp.reasons.join(', ') + ' (SOP 13.2)');
        if (sp && sp.group === 'anticoag' && sp.inr !== null) spWhy.push('INR ' + sp.inr + (sp.symptomatic ? ', 1 órás CT-kritérium áll fenn' : '') + ' (SOP 13.1)');
        return '<div class="note ' + (ct.timing === '1h' || (sp && sp.ctTiming === 'now') ? 'danger' : 'warn') + '"><b>' + t + '</b>' +
          li(spWhy.concat(ct.reasons), ctx.esc) +
          (ct.highExtra ? '<div>Kiegészítés: legalább CI–CII, optimálisan CI–ThI.</div>' : '') +
          (ct.cspine.length ? '<div><b>Nyaki gerinc CT is:</b>' + li(ct.cspine, ctx.esc) + '</div>' : '') + '</div>';
      },
    },
    deterioration: {
      render: function (ctx) {
        return '<div class="note warn">' + li([
          'Izgatottság vagy rendellenes viselkedés',
          'Legalább 30 percig tartó 1 pontos GCS-csökkenés (különösen a motoros pontszámban)',
          '≥3 pont csökkenés a szemnyitási vagy verbális, ≥2 pont a motoros pontszámban',
          'Súlyos vagy fokozódó fejfájás, tartós hányás',
          'Új neurológiai jel (pupilla-egyenlőtlenség, végtag- / arcmozgás aszimmetriája)',
        ], ctx.esc) + 'Ilyenkor sürgős újraértékelés és ismételt CT; egyébként kontroll CT az első vizsgálat után 12 órával (SOP 11.).</div>';
      },
    },
    golden: {
      render: function () { return ''; },
      live: function (ctx) {
        var html = '';
        var bp = L.bpTargets(ctx.state);
        if (bp) {
          var z = {
            hypo: '<b>Hypotonia</b> (<90 Hgmm): 250–500 ml iv. krisztalloid 15–30 perc alatt; max. 500 ml után is fennálló hypotoniánál noradrenalin 0,1–1,0 µg/kg/perc (2. választás dobutamin 2–20 µg/kg/perc).',
            '150-220': '<b>150–220 Hgmm:</b> kontraindikáció nélkül 140 Hgmm alá csökkentendő. Az első órában ne csökkenjen ' + bp.floor1h + ' Hgmm alá (max. 15%).',
            over220: '<b>>220 Hgmm:</b> folyamatosan adagolt iv. szer, RR-monitorozás; cél 220/120 Hgmm alá. Az első órában ne csökkenjen ' + bp.floor1h + ' Hgmm alá (max. 15%).',
            normal: 'Szisztolés ' + bp.sys + ' Hgmm: az SOP vérnyomáscsökkentést nem ír elő.',
          }[bp.zone];
          html += '<div class="note ' + (bp.zone === 'normal' ? 'info' : 'warn') + '">' + z +
            (bp.zone === '150-220' || bp.zone === 'over220' ? '<br>Labetalol 10–20 mg bolus 1–2 perc alatt (kétszer ismételhető), majd 1 mg/perc infúzió (max. 6 mg/perc); kontraindikáció esetén urapidil 5 mg-os frakciókban, majd 9–30 mg/óra. Intubált betegnél előbb a szedáció.' : '') +
            ' <span class="ref">SOP 5. C</span></div>';
        }
        var d = L.doses(ctx.state);
        if (d) {
          var row = function (n, v, u, ref) { return '<tr><td>' + n + '</td><td><b>' + v[0] + '–' + v[1] + ' ' + u + '</b></td><td class="ref">' + ref + '</td></tr>'; };
          html += '<table class="ref-table"><thead><tr><th>Gyógyszer (' + d.weight + ' kg)</th><th>Dózis</th><th></th></tr></thead><tbody>' +
            row('Diazepam (roham, 1. vonal) – 0,1–0,2 mg/ttkg', d.diazepam, 'mg', 'SOP 10.') +
            '<tr><td>Levetiracetam (2. vonal)</td><td><b>250 mg iv. bolus</b>, ismételhető 250 mg-mal 1500 mg-ig</td><td class="ref">SOP 10.</td></tr>' +
            row('Fenitoin (3. vonal) – 15–20 mg/ttkg', d.phenytoin, 'mg', 'SOP 10.') +
            row('Mannitol – 0,25–1 g/ttkg', d.mannitol, 'g', 'SOP 10.') +
            row('Ketamin iv. – 0,1–0,3 mg/kg', d.ketamineIv, 'mg', 'SOP 10.') +
            row('Ketamin im. – 1–3 mg/kg', d.ketamineIm, 'mg', 'SOP 10.') +
            row('Fentanyl – 1–2 µg/ttkg', d.fentanyl, 'µg', 'SOP 10.') +
            row('Noradrenalin – 0,1–1,0 µg/kg/perc', d.noradrenalin, 'µg/perc', 'SOP 5.') +
            row('Dobutamin – 2–20 µg/kg/perc', d.dobutamin, 'µg/perc', 'SOP 5.') +
            row('Lélegeztetés: TV 4–6 ml/ttkg', d.tv, 'ml', 'SOP 5.') +
            '</tbody></table><p class="ill-note">A dózisok az SOP-ban megadott testtömeg-arányos értékekből számolva; ellenőrizze alkalmazás előtt.</p>';
        }
        html += '<div class="note info"><b>Célértékek:</b> SpO₂ 90–94% (lélegeztetve >94%), PaO₂ 60–100, PaCO₂ 35–40 Hgmm, vércukor 4,4–6,1 mmol/l, szérum-ozmolaritás <315 mmol/l, láz kezelendő. <b>Szteroid nem ajánlott. NSAID nem javasolt</b> (kivéve paracetamol). Antikoaguláció felfüggesztése: ClotPro eljárásrend. <span class="ref">SOP 5., 8., 10.</span></div>';
        return html;
      },
    },
  };

  SBO.register({
    id: 'fejserules',
    title: 'Fejsérülés, intracranialis vérzés',
    short: 'Fejsérülés / IC vérzés',
    description: 'Fejsérültek rizikócsoportja, CT-indikáció és időzítés, antikoagulált / TAG-gátlót szedő betegek, obszerváció, aranyóra, nem traumás ICH és SAV.',
    sop: C.SOP,
    steps: STEPS,
    stepVisible: stepVisible,
    stageToStep: { start: 'start', nontrauma: 'nontrauma', risk: 'risk', ct: 'ct', ctresult: 'ctresult', dispo: 'dispo', treatment: 'treatment', done: 'summary' },
    evaluate: L.evaluate,
    categories: {
      LOW: 'Alacsony kockázatú fejsérült', MODERATE: 'Közepes kockázatú fejsérült', HIGH: 'Magas kockázatú fejsérült',
      POSITIVE: 'CT-vel igazolt traumás intracranialis sérülés', NONTRAUMA: 'Nem traumás intracranialis vérzés',
    },
    dangerCategories: ['HIGH', 'POSITIVE', 'NONTRAUMA'],
    widgets: widgets,
    reportFindings: function (s, r) {
      var lines = [];
      if (r.gcs && r.gcs.complete) lines.push('GCS: ' + r.gcs.total + ' (E' + r.gcs.e + ' V' + r.gcs.v + ' M' + r.gcs.m + ')');
      if (r.risk && r.risk.level) {
        lines.push('RIZIKÓCSOPORT: ' + { low: 'alacsony', moderate: 'közepes', high: 'magas' }[r.risk.level]);
        r.risk.high.concat(r.risk.moderate).forEach(function (x) { lines.push('- ' + x); });
      }
      if (r.ct && r.ct.indicated) lines.push('CT-INDIKÁCIÓ: ' + r.ct.reasons.join('; '));
      if (s['ct.result']) lines.push('CT: ' + (s['ct.result'] === 'pos' ? 'pozitív' : 'negatív'));
      return lines;
    },
    docSections: function (s, r) { return D.sections(s, r); },
    reference: function () { return C.REFERENCE; },
  });
})();

</script>
  <!-- A motor indítása a modulok után -->
  <script>
/*
 * SBO döntéstámogató – közös felület-motor.
 * Az eljárásrend-specifikus tartalom (lépések, döntési logika, widgetek, dokumentáció, referencia)
 * a protocols/<id>/protocol.js modulokban van; ez a fájl csak megjeleníti és kezeli őket.
 */
(function () {
  'use strict';

  var YN = [{ v: 'yes', l: 'Igen' }, { v: 'no', l: 'Nem' }];

  var P = null;          // aktuális eljárásrend
  var states = {};       // eljárásrendenként külön betegállapot (memóriában, nem tárolódik)
  var state = {};
  var current = null;    // aktuális lépés
  var view = 'home';     // home | exam | reference
  var openIllus = {};
  var epiEdits = {};
  var refOpen = null;
  var lastSig = '';      // a látható lépések és mezők „ujjlenyomata” (feltételes mezők megjelenésének észleléséhez)

  function esc(t) {
    return String(t === undefined || t === null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function $(id) { return document.getElementById(id); }
  function stepById(id) { return P.steps.filter(function (x) { return x.id === id; })[0]; }
  function evaluate() { return P.evaluate(state); }
  function isExpired(p) { return p.sop.validUntil && new Date() > new Date(p.sop.validUntil + 'T23:59:59'); }

  /* ---------------------------------------------------------------- */
  /* Mezők                                                             */
  /* ---------------------------------------------------------------- */
  function radios(key, options, label) {
    var v = state[key];
    return '<fieldset class="field"><legend>' + esc(label) + '</legend><div class="seg">' +
      options.map(function (o) {
        var id = 'f_' + key.replace(/\W/g, '_') + '_' + o.v.replace(/\W/g, '_');
        return '<input type="radio" id="' + id + '" name="' + esc(key) + '" value="' + esc(o.v) + '" data-key="' + esc(key) + '"' + (v === o.v ? ' checked' : '') + '>' +
          '<label for="' + id + '">' + esc(o.l) + '</label>';
      }).join('') +
      (v ? '<button type="button" class="clear" data-clear="' + esc(key) + '" title="Válasz törlése">×</button>' : '') +
      '</div></fieldset>';
  }

  function ctx(r) { return { state: state, r: r, esc: esc, radios: radios }; }

  function renderField(f, r) {
    if (f.when && !f.when(state, r)) return '';
    switch (f.type) {
      case 'yn': return radios(f.key, YN, f.label);
      case 'choice': return radios(f.key, f.options, f.label);
      case 'check':
        return '<label class="check"><input type="checkbox" data-key="' + esc(f.key) + '"' + (state[f.key] ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
      case 'text':
        return '<label class="field"><span>' + esc(f.label) + '</span><input type="text" data-key="' + esc(f.key) + '" value="' + esc(state[f.key]) + '"></label>';
      case 'textarea':
        return '<label class="field"><span>' + esc(f.label) + '</span><textarea data-key="' + esc(f.key) + '" rows="' + (f.rows || 3) + '">' + esc(state[f.key]) + '</textarea></label>';
      case 'num':
        return '<label class="field"><span>' + esc(f.label) + '</span><input type="number" inputmode="decimal" data-key="' + esc(f.key) + '" value="' + esc(state[f.key]) + '"></label>';
      case 'num2':
        return '<div class="field"><span>' + esc(f.label) + '</span><div class="row">' + f.keys.map(function (k, i) {
          return '<input type="number" inputmode="decimal" placeholder="' + esc(f.ph[i]) + '" data-key="' + esc(k) + '" value="' + esc(state[k]) + '">';
        }).join('<span class="sep">/</span>') + '</div></div>';
      case 'heading': return '<h3>' + esc(f.label) + '</h3>';
      case 'note': return '<div class="note ' + f.level + '">' + f.html + '</div>';
      case 'illus': return renderIllus(f.name);
      case 'widget': {
        var w = P.widgets && P.widgets[f.name];
        if (!w) return '<div class="note danger">Hiányzó widget: ' + esc(f.name) + '</div>';
        return w.render(ctx(r)) + (w.live ? '<div data-live="' + esc(f.name) + '">' + w.live(ctx(r)) + '</div>' : '');
      }
      case 'summary': return renderSummary(r);
      default: return '';
    }
  }

  function renderIllus(name) {
    if (!P.illustrations) return '';
    var open = !!openIllus[name];
    return '<details class="illus" data-illus="' + name + '"' + (open ? ' open' : '') + '><summary>Hogyan néz ki? (animált ábra)</summary>' +
      (open ? P.illustrations.get(name) : '') + '</details>';
  }

  /* ---------------------------------------------------------------- */
  /* Összegzés és dokumentáció                                         */
  /* ---------------------------------------------------------------- */
  function reportText(r) {
    var lines = [];
    lines.push(P.short.toUpperCase() + ' – SBO VIZSGÁLAT ÖSSZEFOGLALÓ (' + new Date().toLocaleString('hu-HU') + ')');
    lines.push('Az ' + P.sop.issuer + ' „' + P.sop.title + '” SOP (' + P.sop.version + ') alapján, döntéstámogató alkalmazással.');
    lines.push('');
    if (P.reportFindings) { lines = lines.concat(P.reportFindings(state, r)); lines.push(''); }
    lines.push('DÖNTÉSI ÚT:');
    r.path.forEach(function (p) { lines.push('- ' + p); });
    lines.push('');
    lines.push('CSOPORTDIAGNÓZIS: ' + (r.category ? P.categories[r.category] : 'még nem meghatározott'));
    var list = function (title, arr, withRef) {
      if (!arr || !arr.length) return;
      lines.push(title + ':');
      arr.forEach(function (a) { lines.push('- ' + a.text + (withRef && a.ref ? ' [' + a.ref + ']' : '')); });
    };
    list('MUNKADIAGNÓZIS', r.workingDx, false);
    list('TEENDŐK', r.actions, true);
    list('DISZPOZÍCIÓ', r.disposition, true);
    if (state.note) { lines.push(''); lines.push('MEGJEGYZÉS: ' + state.note); }
    return lines.join('\n');
  }

  function renderSummary(r) {
    var html = '<label class="field"><span>Saját megjegyzés (a strukturált összegzésbe kerül)</span><textarea data-key="note" rows="2">' + esc(state.note) + '</textarea></label>';
    if (P.docSections) {
      html += '<h3>Szöveg az SBO ambuláns lapba – részenként másolható</h3>' +
        '<div class="note info">A „___” helyeket töltse ki. A szöveg itt szerkeszthető; a szerkesztett részt a további adatváltozás nem írja felül (az „Újragenerálás” igen). ' +
        'Állítás csak a megadott adatokból kerül bele; „negál” csak kifejezett nemleges válasznál.</div>' +
        '<div class="row gap"><button type="button" class="btn primary" data-copy-all="1">Minden rész másolása</button>' +
        '<button type="button" class="btn" id="regenEpi">Újragenerálás az adatokból</button></div>';
      html += P.docSections(state, r).map(function (x) {
        var v = epiEdits[x.id] !== undefined ? epiEdits[x.id] : x.text;
        var rows = Math.min(14, Math.max(3, Math.ceil(v.length / 95) + (v.match(/\n/g) || []).length));
        return '<div class="epi-sec"><div class="epi-head"><b>' + esc(x.title) + '</b>' +
          (epiEdits[x.id] !== undefined ? ' <span class="ref">szerkesztve</span>' : '') +
          '<button type="button" class="btn small" data-copy="epi-' + x.id + '">Másolás</button></div>' +
          '<textarea id="epi-' + x.id + '" data-epi="' + x.id + '" class="report epi" rows="' + rows + '" spellcheck="false">' + esc(v) + '</textarea></div>';
      }).join('');
    }
    html += '<h3>Strukturált összegzés (döntési út, SOP-hivatkozásokkal)</h3>' +
      '<div class="row gap"><button type="button" class="btn" data-copy="report">Összegzés másolása</button>' +
      '<button type="button" class="btn" onclick="window.print()">Nyomtatás</button></div>' +
      '<pre id="report" class="report">' + esc(reportText(r)) + '</pre>';
    return html;
  }

  /* ---------------------------------------------------------------- */
  /* Döntéstámogató panel                                              */
  /* ---------------------------------------------------------------- */
  function renderPanel(r) {
    var danger = (P.dangerCategories || []).indexOf(r.category) >= 0;
    var html = '<div class="cat ' + (r.category ? (danger ? 'danger' : '') : 'none') + '">' + (r.category ? esc(P.categories[r.category]) : 'Besorolás folyamatban…') + '</div>';
    if (r.path.length) html += '<h4>Döntési út</h4><ol class="path">' + r.path.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>';
    if (r.alerts.length) html += r.alerts.map(function (a) { return '<div class="note ' + a.level + '">' + esc(a.text) + ' <span class="ref">' + esc(a.ref) + '</span></div>'; }).join('');
    var list = function (title, arr) {
      return arr && arr.length ? '<h4>' + title + '</h4><ul>' + arr.map(function (a) { return '<li>' + esc(a.text) + ' <span class="ref">' + esc(a.ref) + '</span></li>'; }).join('') + '</ul>' : '';
    };
    html += list('Munkadiagnózis', r.workingDx);
    html += list('Teendők', r.actions);
    html += list('Diszpozíció', r.disposition);
    if (r.differentials && r.differentials.length) {
      html += '<details><summary>' + esc(P.differentialsTitle || 'Differenciáldiagnózis') + '</summary>' + r.differentials.map(function (d) {
        return '<div><b>' + esc(d.group) + ':</b> ' + d.items.map(esc).join(', ') + '</div>';
      }).join('') + '</details>';
    }
    var next = P.stageToStep[r.stage];
    if (next && next !== current && stepById(next)) {
      html += '<button type="button" class="btn primary block" data-goto="' + next + '">Következő teendő: ' + esc(stepById(next).title) + ' →</button>';
    }
    return html;
  }

  /* ---------------------------------------------------------------- */
  /* Nézetek                                                           */
  /* ---------------------------------------------------------------- */
  function renderHome() {
    var cards = SBO.protocols.map(function (p) {
      var exp = isExpired(p);
      return '<button type="button" class="pcard" data-open="' + esc(p.id) + '">' +
        '<span class="pnum">' + esc(p.sop.number || '') + '</span>' +
        '<span class="pbody"><b>' + esc(p.title) + '</b><span>' + esc(p.description || '') + '</span>' +
        '<small>' + esc(p.sop.issuer) + ' · ' + esc(p.sop.version) +
        (p.sop.validUntil ? ' · <span class="' + (exp ? 'expired' : 'valid') + '">' + (exp ? 'lejárt: ' : 'érvényes: ') + esc(p.sop.validUntil.replace(/-/g, '.')) + '</span>' : '') +
        '</small></span></button>';
    }).join('');
    $('home').innerHTML = '<h2>Eljárásrendek</h2><p class="muted">Válassza ki, melyik SOP szerint vizsgálja a beteget.</p>' +
      '<div class="pgrid">' + cards + '</div>' +
      '<p class="muted small">Új eljárásrend hozzáadása: a repó <code>docs/UJ_ELJARASREND.md</code> leírása szerint.</p>';
  }

  function renderReference() {
    var secs = P.reference ? P.reference(esc) : [];
    $('reference').innerHTML = secs.length ? secs.map(function (sec) {
      return '<details class="refsec" id="ref-' + sec.id + '"' + (refOpen === sec.id ? ' open' : '') + '><summary>' + esc(sec.title) + '</summary><div>' + sec.html + '</div></details>';
    }).join('') : '<p class="muted">Ehhez az eljárásrendhez nincs referencia-tartalom.</p>';
    if (refOpen) {
      var el = $('ref-' + refOpen);
      if (el) el.scrollIntoView();
      refOpen = null;
    }
  }

  function visibility(r) {
    var steps = P.steps.filter(function (st) { return !P.stepVisible || P.stepVisible(st.id, state, r); });
    var step = stepById(current);
    var fields = step ? step.fields.map(function (f) { return f.when && !f.when(state, r) ? 0 : 1; }).join('') : '';
    return { steps: steps, sig: steps.map(function (x) { return x.id; }).join(',') + '|' + current + '|' + fields };
  }

  function renderExam() {
    var r = evaluate();
    var steps = P.steps.filter(function (st) { return !P.stepVisible || P.stepVisible(st.id, state, r); });
    if (!steps.some(function (s) { return s.id === current; })) current = steps[0].id;
    var nextStage = P.stageToStep[r.stage];
    $('steps').innerHTML = steps.map(function (st, i) {
      var cls = st.id === current ? 'current' : '';
      if (st.id === nextStage && st.id !== current) cls += ' todo';
      return '<li><button type="button" class="' + cls + '" data-goto="' + st.id + '"><span class="n">' + (i + 1) + '</span>' + esc(st.title) + '</button></li>';
    }).join('');
    var step = stepById(current);
    var idx = steps.indexOf(step);
    var html = '<h2>' + esc(step.title) + (step.ref ? ' <span class="ref">' + esc(step.ref) + '</span>' : '') + '</h2>';
    html += step.fields.map(function (f) { return renderField(f, r); }).join('');
    html += '<div class="nav">' +
      (idx > 0 ? '<button type="button" class="btn" data-goto="' + steps[idx - 1].id + '">← Vissza</button>' : '<span></span>') +
      (idx < steps.length - 1 ? '<button type="button" class="btn primary" data-goto="' + steps[idx + 1].id + '">Tovább →</button>' : '') +
      '</div>';
    $('form').innerHTML = html;
    $('panel').innerHTML = renderPanel(r);
    lastSig = visibility(r).sig;
    var cur = document.querySelector('#steps .current');
    if (cur && cur.scrollIntoView && window.innerWidth <= 1100) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function render() {
    if (view !== 'home' && !P) view = 'home';
    $('home').hidden = view !== 'home';
    $('exam').hidden = view !== 'exam';
    $('reference').hidden = view !== 'reference';
    $('viewHome').classList.toggle('active', view === 'home');
    $('viewExam').classList.toggle('active', view === 'exam');
    $('viewRef').classList.toggle('active', view === 'reference');
    ['viewExam', 'viewRef', 'reset'].forEach(function (id) { $(id).hidden = !P; });
    $('ptitle').textContent = P ? P.title : 'Válasszon eljárásrendet';
    $('psub').textContent = P ? (P.sop.issuer + ' SOP ' + (P.sop.number ? P.sop.number + ', ' : '') + P.sop.version) : 'Döntéstámogató az SBO eljárásrendjei alapján';
    var b = $('validity');
    b.hidden = !(P && isExpired(P) && view !== 'home');
    if (!b.hidden) b.textContent = 'Figyelem: a forrás SOP (' + P.sop.version + ') érvényessége ' + P.sop.validUntil.replace(/-/g, '.') + '. lejárt – ellenőrizze, van-e frissebb változat.';
    document.title = P ? P.short + ' – SBO döntéstámogató' : 'SBO döntéstámogató';
    if (view === 'home') renderHome();
    else if (view === 'reference') renderReference();
    else renderExam();
  }

  function openProtocol(id, keepView) {
    var p = SBO.protocols.filter(function (x) { return x.id === id; })[0];
    if (!p) { P = null; view = 'home'; render(); return; }
    if (P) states[P.id] = { state: state, current: current, epiEdits: epiEdits };
    P = p;
    var saved = states[p.id] || { state: {}, current: p.steps[0].id, epiEdits: {} };
    state = saved.state; current = saved.current; epiEdits = saved.epiEdits;
    openIllus = {};
    if (!keepView) view = 'exam';
    render();
  }

  function route() {
    var m = location.hash.match(/^#\/([\w-]+)(?:\/(ref))?/);
    if (!m) { view = 'home'; render(); return; }
    view = m[2] ? 'reference' : 'exam';
    if (!P || P.id !== m[1]) openProtocol(m[1], true); else render();
  }

  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  /* ---------------------------------------------------------------- */
  /* Események                                                         */
  /* ---------------------------------------------------------------- */
  function updateLive() {
    if (!P || view !== 'exam') return;
    var r = evaluate();
    // Ha az adatváltozás miatt mező vagy lépés jelenik meg / tűnik el, teljes újrarajzolás a fókusz megtartásával
    if (visibility(r).sig !== lastSig) {
      var a = document.activeElement, key = a && a.getAttribute && a.getAttribute('data-key');
      var pos = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;
      render();
      if (key) {
        var el = document.querySelector('[data-key="' + key + '"]:not([type=radio])');
        if (el) {
          el.focus();
          if (pos !== null) el.setSelectionRange(pos, pos);
          else { var v = el.value; el.value = ''; el.value = v; } // számmező: a kurzor a végére (gépelés közben ott van)
        }
      }
      return;
    }
    $('panel').innerHTML = renderPanel(r);
    var rep = $('report');
    if (rep) rep.textContent = reportText(r);
    if (P.docSections && document.querySelector('[data-epi]')) {
      P.docSections(state, r).forEach(function (x) {
        var ta = $('epi-' + x.id);
        if (ta && epiEdits[x.id] === undefined) ta.value = x.text;
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-live]'), function (el) {
      var w = P.widgets[el.getAttribute('data-live')];
      if (w && w.live) el.innerHTML = w.live(ctx(r));
    });
  }

  window.addEventListener('hashchange', route);

  // Az ábrák csak lenyitva renderelődnek; a nyitott állapot megmarad az újrarajzolások között.
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (!d.getAttribute || !d.getAttribute('data-illus') || !P || !P.illustrations) return;
    var name = d.getAttribute('data-illus');
    openIllus[name] = d.open;
    if (d.open && !d.querySelector('svg')) d.insertAdjacentHTML('beforeend', P.illustrations.get(name));
  }, true);

  document.addEventListener('change', function (e) {
    var t = e.target, key = t.getAttribute && t.getAttribute('data-key');
    if (!key) return;
    if (t.type === 'checkbox') state[key] = t.checked;
    else state[key] = t.value;
    if (t.type === 'radio' || t.type === 'checkbox') render();
    else updateLive();
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-epi')) { epiEdits[t.getAttribute('data-epi')] = t.value; return; }
    var key = t.getAttribute && t.getAttribute('data-key');
    if (!key || (t.type !== 'text' && t.tagName !== 'TEXTAREA' && t.type !== 'number')) return;
    state[key] = t.value;
    updateLive();
  });

  function copy(btn, txt) {
    var label = btn.textContent;
    var done = function () { btn.textContent = 'Másolva ✓'; setTimeout(function () { btn.textContent = label; }, 1500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done);
    else {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { /* nincs vágólap-hozzáférés */ }
      document.body.removeChild(ta);
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-open],[data-goto],[data-clear],[data-goto-ref],[data-copy],[data-copy-all],#regenEpi,#viewHome,#viewExam,#viewRef,#reset') : null;
    if (!t) return;
    if (t.hasAttribute('data-open')) { go('#/' + t.getAttribute('data-open')); return; }
    if (t.hasAttribute('data-goto')) { current = t.getAttribute('data-goto'); if (view !== 'exam') go('#/' + P.id); else render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-clear')) { delete state[t.getAttribute('data-clear')]; render(); return; }
    if (t.hasAttribute('data-goto-ref')) { refOpen = t.getAttribute('data-goto-ref'); go('#/' + P.id + '/ref'); return; }
    if (t.id === 'viewHome') { go('#/'); return; }
    if (t.id === 'viewExam') { go('#/' + P.id); return; }
    if (t.id === 'viewRef') { go('#/' + P.id + '/ref'); return; }
    if (t.id === 'reset') {
      if (confirm('Új beteg: a(z) „' + P.short + '” eljárásrendben megadott adatok törlődnek. Folytatja?')) {
        state = {}; epiEdits = {}; openIllus = {}; current = P.steps[0].id; delete states[P.id]; go('#/' + P.id);
      }
      return;
    }
    if (t.id === 'regenEpi') { epiEdits = {}; render(); return; }
    if (t.hasAttribute('data-copy-all')) {
      copy(t, Array.prototype.map.call(document.querySelectorAll('[data-epi]'), function (ta) {
        return ta.closest('.epi-sec').querySelector('b').textContent.toUpperCase() + ':\n' + ta.value;
      }).join('\n\n'));
      return;
    }
    if (t.hasAttribute('data-copy')) {
      var src = $(t.getAttribute('data-copy'));
      copy(t, src.tagName === 'TEXTAREA' ? src.value : src.textContent);
    }
  });

  // Egyetlen eljárásrend esetén is a kezdőlap jelenik meg, hogy a bővítés látható legyen.
  route();
})();

</script>
</body>
</html>
