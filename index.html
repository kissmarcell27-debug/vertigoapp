<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SBO döntéstámogató</title>
  <meta name="description" content="Döntéstámogató a sürgősségi osztály eljárásrendjei (SOP) alapján.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="ptitle">SBO döntéstámogató</h1>
      <p id="psub"></p>
    </div>
    <nav class="tabs">
      <button type="button" id="viewHome">Eljárásrendek</button>
      <button type="button" id="viewExam">Vizsgálat</button>
      <button type="button" id="viewRef">Referencia</button>
      <button type="button" id="reset" class="danger">Új beteg</button>
    </nav>
  </header>
  <div id="validity" class="banner" hidden></div>
  <div class="disclaimer">
    Döntéstámogató eszköz – nem helyettesíti a klinikai ítéletet és a szakmai felelősséget. Adatot nem tárol és nem küld: minden a böngészőben marad, és oldalfrissítéskor törlődik.
  </div>

  <main id="home" class="home" hidden></main>
  <main id="exam" class="layout" hidden>
    <aside class="steps-wrap"><ol id="steps" class="steps"></ol></aside>
    <section id="form" class="card form"></section>
    <aside id="panel" class="card panel" aria-live="polite"></aside>
  </main>
  <a href="#panel" class="jump">Döntéstámogatás ↓</a>
  <main id="reference" class="reference" hidden></main>

  <!-- Közös motor -->
  <script src="js/core/registry.js"></script>
  <!-- Eljárásrendek (mindegyik a saját mappájában; a protocol.js jelentkezik be a SBO.register-rel) -->
  <script src="protocols/szedules/logic.js"></script>
  <script src="protocols/szedules/content.js"></script>
  <script src="protocols/szedules/illustrations.js"></script>
  <script src="protocols/szedules/docs.js"></script>
  <script src="protocols/szedules/protocol.js"></script>
  <script src="protocols/syncope/logic.js"></script>
  <script src="protocols/syncope/content.js"></script>
  <script src="protocols/syncope/docs.js"></script>
  <script src="protocols/syncope/protocol.js"></script>
  <script src="protocols/fejserules/logic.js"></script>
  <script src="protocols/fejserules/content.js"></script>
  <script src="protocols/fejserules/docs.js"></script>
  <script src="protocols/fejserules/protocol.js"></script>
  <!-- A motor indítása a modulok után -->
  <script src="js/core/engine.js"></script>
</body>
</html>
